name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Tested immutable commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Validate immutable release input
        id: validate
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.release_sha }}
      - name: Verify checked-out commit
        env:
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger protected production deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK&ref=$RELEASE_SHA"

