name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Tested immutable commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Require full SHA and verify commit
        run: |
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger protected production deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK&ref=$RELEASE_SHA"

