name: Roll back production

on:
  workflow_dispatch:
    inputs:
      known_good_sha:
        description: "Previously verified 40-character commit SHA"
        required: true
        type: string
      incident_reference:
        description: "Issue or incident reference"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - name: Validate immutable rollback input
        id: validate
        env:
          REQUESTED_SHA: ${{ inputs.known_good_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.release_sha }}
      - name: Verify rollback target
        env:
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

  rollback:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy known-good revision
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
        run: |
          test -n "$DEPLOY_HOOK"
          test -n "$INCIDENT_REFERENCE"
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK&ref=$RELEASE_SHA"

