name: Deploy development

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-development
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build development dashboard
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://crvt-api.onrender.com/api/v1
          VITE_API_DOCS_URL: https://crvt-api.onrender.com/docs
        run: npm run build -- --base=/ai-dev-tools-credit-risk-validation-tracker/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload development artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy development dashboard
        id: deployment
        uses: actions/deploy-pages@v4

