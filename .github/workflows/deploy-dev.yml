name: Deploy development

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger development deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail-with-body --retry 3 --request POST "$DEPLOY_HOOK"

