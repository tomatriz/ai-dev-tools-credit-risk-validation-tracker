services:
  - type: web
    name: crvt-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crvt-postgres
          property: connectionString
      - key: OPS_TOKEN
        generateValue: true
      - key: OTEL_SDK_DISABLED
        value: "true"

  - type: web
    name: crvt-dashboard
    runtime: docker
    plan: free
    rootDir: frontend
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: crvt-api
          type: web
          property: hostport

databases:
  - name: crvt-postgres
    plan: free

