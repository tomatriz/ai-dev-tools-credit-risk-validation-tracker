services:
  - type: web
    name: crvt-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crvt-postgres
          property: connectionString
      - key: OPS_TOKEN
        generateValue: true
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://tomatriz.github.io

  - type: web
    name: crvt-dashboard
    runtime: docker
    plan: free
    rootDir: frontend
    envVars:
      - key: BACKEND_ORIGIN
        value: https://crvt-api.onrender.com

databases:
  - name: crvt-postgres
    plan: free

