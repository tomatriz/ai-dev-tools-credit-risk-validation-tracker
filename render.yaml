services:
  - type: web
    name: crvt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crvt-postgres
          property: connectionString
      - key: OPS_TOKEN
        generateValue: true
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: crvt-dashboard
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: crvt-postgres
    databaseName: credit_risk
    user: credit_risk
    plan: free

