global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: crvt-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

