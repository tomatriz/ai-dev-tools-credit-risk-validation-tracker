name: credit-risk-validation-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://credit_risk:local_demo_only@db:5432/credit_risk}
      OPS_TOKEN: ${OPS_TOKEN:-local-demo-token}
      ALLOW_INSECURE_DEMO_CREDENTIALS: "true"
      LOG_FILE: /var/log/crvt/backend.jsonl
      OTEL_SERVICE_NAME: crvt-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    volumes:
      - app_logs:/var/log/crvt
    ports:
      - "127.0.0.1:${CRVT_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    environment:
      BACKEND_HOSTPORT: backend:8000
    ports:
      - "127.0.0.1:${CRVT_FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  oncall:
    build: ./oncall
    environment:
      BACKEND_URL: http://backend:8000
      OPS_TOKEN: ${OPS_TOKEN:-local-demo-token}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-local-alert-token}
      ALLOW_INSECURE_DEMO_CREDENTIALS: "true"
    ports:
      - "127.0.0.1:${CRVT_ONCALL_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${CRVT_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${CRVT_ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      - oncall

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${CRVT_TEMPO_PORT:-3200}:3200"

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${CRVT_LOKI_PORT:-3100}:3100"

  alloy:
    image: grafana/alloy:v1.9.1
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app_logs:/var/log/crvt:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${CRVT_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
  app_logs:

